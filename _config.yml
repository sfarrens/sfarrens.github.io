title: Sam Farrens
description: "Samuel Farrens — Research Director in astrophysics and cosmology at CEA Paris-Saclay"
show_downloads: true
google_analytics: G-MNRP3PSDH2
twitter_username: Sam_Farrens
title_image: /assets/images/homeimage.png
post_author: Samuel Farrens
image_path: /assets/images
url: "https://sfarrens.github.io"

plugins:
  - jekyll-target-blank

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

kramdown:
   toc_levels: 1..2

# Setting exclude replaces Jekyll's defaults, so list everything that must not be published.
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - Gemfile.dev
  - Gemfile.dev.lock
  - sf_theme.gemspec
  - serve.sh
  - scripts
  - notebooks
  - "CV 2026"
  - CLAUDE.md
  - README.md
  - LICENSE
